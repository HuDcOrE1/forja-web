<div class="table-container">

  <table>

    <thead>

      <tr>

        <th>Nome</th>

        <th>CPF</th>

        <th>E-mail</th>

        <th>Telefone</th>

        <th>Status</th>

        <th>Ações</th>

      </tr>

    </thead>

    <tbody>

      @for (cliente of clientes; track cliente.id) {

        <tr>

          <td>{{ cliente.nome }}</td>

          <td>{{ cliente.cpf }}</td>

          <td>{{ cliente.email }}</td>

          <td>{{ cliente.telefone }}</td>

          <td>

            @if (cliente.ativo) {

              <span class="status-ativo">
                Ativo
              </span>

            } @else {

              <span class="status-inativo">
                Inativo
              </span>

            }

          </td>

          <td>

            <div class="acoes">

                <a
                class="btn-icon"
                [routerLink]="[
                    '/clientes',
                    cliente.id,
                    'editar'
                ]">

                Editar

                </a>

                <a
                class="btn-icon"
                [routerLink]="[
                    '/clientes',
                    cliente.id
                ]">

                Detalhes

                </a>

            </div>

            </td>
        </tr>
      } @empty {

        <tr>
          <td
            colspan="6"
            class="sem-dados">
            Nenhum cliente encontrado.
          </td>
        </tr>
      }

    </tbody>
  </table>
</div>
