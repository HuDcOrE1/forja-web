@if (cliente) {

<div class="details-container">

  <div class="details-header">

    <h2>
      Dados do Cliente
    </h2>

  </div>

  <div class="details-grid">

    <div class="detail-item">

      <label>Nome</label>

      <span>
        {{ cliente.nome }}
      </span>

    </div>

    <div class="detail-item">

      <label>CPF</label>

      <span>
        {{ cliente.cpf }}
      </span>

    </div>

    <div class="detail-item">

      <label>E-mail</label>

      <span>
        {{ cliente.email }}
      </span>

    </div>

    <div class="detail-item">

      <label>Telefone</label>

      <span>
        {{ cliente.telefone }}
      </span>

    </div>

    <div class="detail-item">

      <label>Status</label>

      @if (cliente.ativo) {

        <span class="status-ativo">
          Ativo
        </span>

      } @else {

        <span class="status-inativo">
          Inativo
        </span>

      }

    </div>

    <div class="detail-item">

      <label>Data Cadastro</label>

      <span>
        {{ cliente.dataCadastro }}
      </span>

    </div>

  </div>

</div>

}
