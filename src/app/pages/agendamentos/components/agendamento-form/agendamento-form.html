<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="section-card">
    <h2 class="section-title">Agendamento</h2>

    <div class="form-grid">
      <div class="form-group">
        <label> Cliente </label>

        <select formControlName="clienteId">
          <option [ngValue]="null">Selecione...</option>

          @for (cliente of clientes; track cliente.id) {
            <option [ngValue]="cliente.id">
              {{ cliente.nome }}
            </option>
          }
        </select>
      </div>

      <div class="form-group">
        <label> Raia </label>

        <select formControlName="raiaId">
          <option [ngValue]="null">Selecione...</option>

          @for (raia of raias; track raia.id) {
            <option [ngValue]="raia.id">{{ raia.numero }} - {{ raia.descricao }}</option>
          }
        </select>
      </div>

      <div class="form-group">
        <label> Início </label>

        <input type="datetime-local" formControlName="dataInicio" />
      </div>

      <div class="form-group">
        <label> Fim </label>

        <input type="datetime-local" formControlName="dataFim" />
      </div>

      <div class="form-group full-width">
        <label> Observação </label>

        <textarea rows="4" formControlName="observacao"> </textarea>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="btn-secondary" type="button" onclick="history.back()">Voltar</button>

    <button class="btn-primary" type="submit">Salvar</button>
  </div>
</form>
