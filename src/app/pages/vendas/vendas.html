<div class="page-header">
  <div>
    <h1>Vendas</h1>

    <p class="subtitulo">Gestão de vendas do FORJA</p>
  </div>

  <a routerLink="/vendas/nova" class="btn-primary"> Nova Venda </a>
</div>

<div class="filtros">
  <input
    type="text"
    placeholder="Pesquisar venda..."
    [(ngModel)]="termoPesquisa"
    (input)="pesquisar()"
  />
</div>

<app-venda-list [vendas]="vendasPaginadas"> </app-venda-list>

<div class="pagination">
  <button type="button" (click)="paginaAnterior()" [disabled]="paginaAtual === 1">Anterior</button>

  <span>
    Página {{ paginaAtual }}

    de

    {{ totalPaginas }}
  </span>

  <button type="button" (click)="proximaPagina()" [disabled]="paginaAtual === totalPaginas">
    Próxima
  </button>
</div>
