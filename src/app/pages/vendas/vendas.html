<div class="page-header">
  <div>
    <h1>Vendas</h1>

    <p class="subtitulo">Gestão de vendas do FORJA</p>
  </div>

  <a routerLink="/vendas/nova" class="btn-primary"> Nova Venda </a>
</div>

<div class="filtros">
  <div class="filtros-grid">
    <input
      type="text"
      placeholder="Pesquisar por cliente, vendedor ou status..."
      [(ngModel)]="termoPesquisa"
      (keyup.enter)="pesquisar()"
    />

    <select [(ngModel)]="status" (change)="filtrarStatus()">
      <option value="">Todos</option>

      <option value="FINALIZADA">Finalizadas</option>

      <option value="CANCELADA">Canceladas</option>
    </select>

    <button type="button" class="btn-primary" (click)="pesquisar()">Pesquisar</button>
  </div>
</div>

<app-venda-list [vendas]="vendas"> </app-venda-list>

<div class="pagination">
  <button type="button" (click)="paginaAnterior()" [disabled]="paginaAtual === 0">Anterior</button>

  <span>
    Página

    {{ paginaAtual + 1 }}

    de

    {{ totalPaginas }}
  </span>

  <button type="button" (click)="proximaPagina()" [disabled]="paginaAtual >= totalPaginas - 1">
    Próxima
  </button>
</div>

<div class="resultado-info">
  Total de registros:

  <strong>
    {{ totalElementos }}
  </strong>
</div>
