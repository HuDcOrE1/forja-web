<div class="table-container">
  <table>
    <thead>
      <tr>
        <th>Nome</th>

        <th>Descrição</th>

        <th>Status</th>

        <th>Ações</th>
      </tr>
    </thead>

    <tbody>
      @for (categoria of categorias; track categoria.id) {
        <tr>
          <td>
            {{ categoria.nome }}
          </td>

          <td>
            {{ categoria.descricao }}
          </td>

          <td>
            @if (categoria.ativo) {
              <span class="status-ativo"> Ativa </span>
            } @else {
              <span class="status-inativo"> Inativa </span>
            }
          </td>

          <td>
            <div class="acoes">
              <a class="btn-icon" [routerLink]="['/categorias-produto', categoria.id, 'editar']">
                Editar
              </a>

              <a class="btn-icon" [routerLink]="['/categorias-produto', categoria.id]">
                Detalhes
              </a>
            </div>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="4" class="sem-dados">Nenhuma categoria encontrada.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
