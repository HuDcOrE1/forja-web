@if (categoria) {
  <div class="categoria-page">
    <div class="header-card">
      <div>
        <h1>
          {{ categoria.nome }}
        </h1>

        <div class="status">
          @if (categoria.ativo) {
            <span class="status-ativo-badge"> ATIVA </span>
          } @else {
            <span class="status-inativo-badge"> INATIVA </span>
          }
        </div>
      </div>
    </div>

    <div class="grid-duplo">
      <div class="section-card">
        <h2>Identificação</h2>

        <div class="info">
          <strong>ID:</strong>

          {{ categoria.id }}
        </div>

        <div class="info">
          <strong>Nome:</strong>

          {{ categoria.nome }}
        </div>
      </div>

      <div class="section-card">
        <h2>Status</h2>

        <div class="info">
          @if (categoria.ativo) {
            <span class="status-ativo"> Disponível para uso </span>
          } @else {
            <span class="status-inativo"> Indisponível </span>
          }
        </div>
      </div>
    </div>

    <div class="section-card">
      <h2>Descrição</h2>

      <div class="info">
        {{ categoria.descricao || '-' }}
      </div>
    </div>
  </div>
}
