<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="section-card">
    <h2 class="section-title">Identificação do Produto</h2>

    <div class="form-grid">
      <div class="form-group">
        <label> Código </label>

        <input type="text" formControlName="codigo" />
      </div>

      <div class="form-group">
        <label> Nome </label>

        <input type="text" formControlName="nome" />
      </div>

      <div class="form-group">
        <label> Categoria </label>

        <select formControlName="categoriaId">
          <option [ngValue]="null">Selecione...</option>

          @for (categoria of categorias; track categoria.id) {
            <option [ngValue]="categoria.id">
              {{ categoria.nome }}
            </option>
          }
        </select>

        @if (form.controls.categoriaId.invalid && form.controls.categoriaId.touched) {
          <small> Categoria é obrigatória. </small>
        }
      </div>

      <div class="form-group">
        <label> Marca </label>

        <input type="text" formControlName="marca" />
      </div>

      <div class="form-group">
        <label> Unidade de Medida </label>

        <select formControlName="unidadeMedida">
          <option value="">Selecione...</option>

          <option value="UN">Unidade</option>

          <option value="CX">Caixa</option>

          <option value="PAR">Par</option>

          <option value="KIT">Kit</option>
        </select>
      </div>
    </div>
  </div>

  <div class="section-card">
    <h2 class="section-title">Descrição</h2>

    <div class="form-group">
      <textarea rows="5" formControlName="descricao"> </textarea>
    </div>
  </div>

  <div class="section-card">
    <h2 class="section-title">Controle de Estoque</h2>

    <div class="form-grid">
      <div class="form-group">
        <label> Estoque Atual </label>

        <input type="number" min="0" formControlName="estoqueAtual" />
      </div>

      <div class="form-group">
        <label> Estoque Mínimo </label>

        <input type="number" min="0" formControlName="estoqueMinimo" />
      </div>
    </div>
  </div>

  <div class="section-card">
    <h2 class="section-title">Precificação</h2>

    <div class="form-grid">
      <div class="form-group">
        <label> Valor de Custo </label>

        <input
          type="text"
          formControlName="valorCusto"
          (input)="aplicarMascaraMoedaCusto($event)"
        />
      </div>

      <div class="form-group">
        <label> Valor de Venda </label>

        <input
          type="text"
          formControlName="valorVenda"
          (input)="aplicarMascaraMoedaVenda($event)"
        />
      </div>
    </div>
  </div>

  <div class="section-card">
    <div class="checkbox-group">
      <input type="checkbox" formControlName="ativo" />

      <label> Produto ativo </label>
    </div>
  </div>

  <div class="actions">
    <button class="btn-secondary" type="button" onclick="history.back()">Voltar</button>

    <button class="btn-primary" type="submit">Salvar</button>
  </div>
</form>
