<div class="page-header">
  <div>
    <h1>Produtos</h1>

    <p class="subtitulo">Gestão de produtos e estoque do FORJA</p>
  </div>

  <a routerLink="/produtos/novo" class="btn-primary"> Novo Produto </a>
</div>

<div class="filtros">
  <div class="filtros-grid">
    <input
      type="text"
      placeholder="Pesquisar produto por nome ou código..."
      [(ngModel)]="termoPesquisa"
      (keyup.enter)="pesquisar()"
    />

    <select [(ngModel)]="statusEstoque" (change)="filtrarStatus()">
      <option value="">Todos</option>

      <option value="SAUDAVEL">Saudável</option>

      <option value="CRITICO">Crítico</option>

      <option value="SEM_ESTOQUE">Sem Estoque</option>
    </select>

    <button type="button" class="btn-primary" (click)="pesquisar()">Pesquisar</button>
  </div>
</div>

<app-produto-list [produtos]="produtos"> </app-produto-list>

<div class="pagination">
  <button type="button" (click)="paginaAnterior()" [disabled]="paginaAtual === 0">Anterior</button>

  <span>
    Página

    {{ paginaAtual + 1 }}

    de

    {{ totalPaginas }}
  </span>

  <button type="button" (click)="proximaPagina()" [disabled]="paginaAtual >= totalPaginas - 1">
    Próxima
  </button>
</div>

<div class="resultado-info">
  Total de registros:

  <strong>
    {{ totalElementos }}
  </strong>
</div>
