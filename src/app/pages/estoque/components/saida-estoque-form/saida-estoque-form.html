<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="section-card">
    <h2 class="section-title">Saída de Estoque</h2>

    <div class="form-grid">
      <div class="form-group">
        <label> Produto </label>

        <select formControlName="produtoId">
          <option [ngValue]="null">Selecione...</option>

          @for (produto of produtos; track produto.id) {
            <option [ngValue]="produto.id">
              {{ produto.codigo }}
              -
              {{ produto.nome }}
            </option>
          }
        </select>

        @if (form.controls.produtoId.invalid && form.controls.produtoId.touched) {
          <small> Produto é obrigatório. </small>
        }
      </div>

      <div class="form-group">
        <label> Quantidade </label>

        <input type="number" min="1" formControlName="quantidade" />

        @if (form.controls.quantidade.invalid && form.controls.quantidade.touched) {
          <small> Quantidade deve ser maior que zero. </small>
        }
      </div>

      <div class="form-group full-width">
        <label> Observação </label>

        <textarea rows="4" formControlName="observacao"> </textarea>
      </div>
    </div>
  </div>

  <div class="actions">
    <button type="button" class="btn-secondary" onclick="history.back()">Voltar</button>

    <button type="submit" class="btn-primary">Registrar Saída</button>
  </div>
</form>
