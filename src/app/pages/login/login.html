<div class="login-container">

  <mat-card class="login-card">

    <h1>FORJA</h1>

    <p>Clube de Tiro</p>

    <form
      [formGroup]="form"
      (ngSubmit)="entrar()">

      <mat-form-field appearance="outline">

        <mat-label>E-mail</mat-label>

        <input
          matInput
          formControlName="email">

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>Senha</mat-label>

        <input
          matInput
          [type]="ocultarSenha ? 'password' : 'text'"
          formControlName="senha">

        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="ocultarSenha = !ocultarSenha">

          <mat-icon>
            {{ ocultarSenha ? 'visibility_off' : 'visibility' }}
          </mat-icon>

        </button>

      </mat-form-field>

      @if (erroLogin) {

        <div class="erro">

          {{ erroLogin }}

        </div>

      }

      <button
        mat-raised-button
        color="primary"
        type="submit"
        [disabled]="carregando">

        Entrar

      </button>

    </form>

  </mat-card>

</div>
