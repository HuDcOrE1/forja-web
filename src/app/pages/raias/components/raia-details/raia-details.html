@if (raia) {
  <div class="raia-page">
    <div class="header-card">
      <div>
        <h1>Raia #{{ raia.numero }}</h1>

        <div class="status">
          @if (raia.ativa) {
            <span class="status-ativo-badge"> ATIVA </span>
          } @else {
            <span class="status-inativo-badge"> INATIVA </span>
          }
        </div>
      </div>
    </div>

    <div class="grid-duplo">
      <div class="section-card">
        <h2>Identificação</h2>

        <div class="info">
          <strong>ID:</strong>

          {{ raia.id }}
        </div>

        <div class="info">
          <strong>Número:</strong>

          {{ raia.numero }}
        </div>
      </div>

      <div class="section-card">
        <h2>Status</h2>

        <div class="info">
          @if (raia.ativa) {
            <span class="status-ativo"> Disponível para uso </span>
          } @else {
            <span class="status-inativo"> Indisponível </span>
          }
        </div>
      </div>
    </div>

    <div class="section-card">
      <h2>Descrição</h2>

      <div class="info">
        {{ raia.descricao }}
      </div>
    </div>
  </div>
}
